name: CI

# Fast checks on every push / PR: frontend typecheck + build, Rust tests, and
# a Windows cross-check of the Rust library (the Windows target's code paths).
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build web bundle
        run: npm run build

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps (Tauri)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev build-essential

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # The CLI/lib tests don't need the Tauri bundle toolchain; skip the
      # tauri-build icon step so `cargo test` runs on every OS.
      - name: Rust tests
        working-directory: src-tauri
        shell: bash
        env:
          RABOBI_SKIP_TAURI_BUILD: "1"
        run: cargo test --lib --bins

      - name: Clippy (lib)
        working-directory: src-tauri
        shell: bash
        env:
          RABOBI_SKIP_TAURI_BUILD: "1"
        run: cargo clippy --lib -- -D warnings
